[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apsystems-connect-core"
version = "0.1.0"
description = "Core library for APsystems Connect"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "python-dotenv",
]

[tool.setuptools.packages.find]
where = ["src"]